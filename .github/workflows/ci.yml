name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server-api
    env:
      # mongodb-memory-server has no 24.04 build of MongoDB 7; the 22.04 one runs fine.
      MONGOMS_DISTRO: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server-api/package-lock.json
      - name: Install redis-server (used by the e2e stack)
        run: sudo apt-get update && sudo apt-get install -y redis-server && sudo systemctl stop redis-server || true
      - name: Cache MongoDB binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-7.0.14-${{ runner.os }}
      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate
      - name: Type check
        run: npx tsc --noEmit -p tsconfig.json
      - name: Lint (platform, Solar, auth and tests)
        run: npx eslint src/solar src/tenancy src/machine-auth src/auth/oidc src/auth/session src/auth/guard src/__shared__/utils test
      - name: Unit tests
        run: npm test -- --ci
      - name: Build
        run: npm run build
      - name: End-to-end tests (Keycloak, tenancy, machine auth, ingestion, outage drills)
        run: npm run test:e2e -- --ci

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: offsettingdashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: offsettingdashboard/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint (Solar dashboard, admin panel, auth, layout)
        run: npx eslint src/features/solar src/features/admin src/i18n src/components/dashboard src/lib/auth src/layout src/routes src/services
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
