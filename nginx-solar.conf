# solar.carbonoz.com — the customer-facing Solar dashboard.
#
# Serves the same Carbonoz SPA and API as login.carbonoz.com. The session
# cookie is shared across both hosts by setting, in server-api/.env:
#   SESSION_COOKIE_DOMAIN=.carbonoz.com
#   AUTH_RETURN_ORIGINS=https://solar.carbonoz.com
#
# The SolarBMS Raspberry Pi / solar.foernernet.de is never exposed to the
# browser. The optional /bms/ block below shows how to put the upstream
# SolarBMS web UI behind Carbonoz authorisation, if we want to embed it.

server {
    listen 80;
    server_name solar.carbonoz.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name solar.carbonoz.com;

    ssl_certificate     /etc/nginx/ssl/solar.carbonoz.com.crt;
    ssl_certificate_key /etc/nginx/ssl/solar.carbonoz.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Opening the host lands on the Solar dashboard.
    location = / {
        return 302 /ds/solar;
    }

    # Frontend (same SPA as login.carbonoz.com)
    location / {
        proxy_pass http://127.0.0.1:5174;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Carbonoz API — the only backend the browser talks to.
    location /api {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Optional: upstream SolarBMS web UI behind Carbonoz authorisation ──
    # Every request is first checked by the API (session cookie + site access);
    # the browser's Carbonoz cookie is NOT forwarded upstream, and the upstream
    # credential lives in a root-only include, never in this repository.
    # Replace SITE_ID with the Carbonoz site that owns this SolarBMS system.
    #
    # location = /_solarbms_access {
    #     internal;
    #     proxy_pass http://127.0.0.1:3000/api/v1/solar/sites/SITE_ID/access;
    #     proxy_pass_request_body off;
    #     proxy_set_header Content-Length "";
    #     proxy_set_header Cookie $http_cookie;
    #     proxy_set_header X-Original-URI $request_uri;
    # }
    #
    # location /bms/ {
    #     auth_request /_solarbms_access;
    #     error_page 401 404 = @solar_login;
    #     proxy_pass https://solar.foernernet.de/;
    #     proxy_set_header Host solar.foernernet.de;
    #     proxy_set_header Cookie "";
    #     include /etc/nginx/secrets/solarbms-upstream.conf;  # proxy_set_header Authorization "...";
    #     proxy_ssl_server_name on;
    # }
    #
    # location @solar_login {
    #     return 302 /api/v1/auth/oidc/login?returnTo=https://solar.carbonoz.com$request_uri;
    # }
}
